[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prvaptmirror"
version = "0.1.0"
description = "Personal signed apt repository with a password-protected admin UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PrvAptMirror" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "python-debian>=0.1.49",
    "zstandard>=0.23.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
prvaptmirror = "prvaptmirror.main:cli"

[tool.setuptools.packages.find]
include = ["prvaptmirror*"]

[tool.setuptools.package-data]
prvaptmirror = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
