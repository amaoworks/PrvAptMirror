<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrvAptMirror{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('admin-static', path='admin.css').path }}?v={{ static_v('admin.css') }}">
  <script defer src="{{ url_for('admin-static', path='htmx.min.js').path }}?v={{ static_v('htmx.min.js') }}"></script>
  <script defer src="{{ url_for('admin-static', path='admin.js').path }}?v={{ static_v('admin.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header>
    <div class="header-inner">
      <a class="header-brand" href="/admin/">PrvAptMirror</a>
      {% if user %}
        {% set path = request.url.path %}
        <nav class="primary-nav" aria-label="管理后台">
          <a href="/admin/" {% if path in ('/admin/', '/admin') %}aria-current="page"{% endif %}>仪表盘</a>
          <a href="/admin/packages" {% if path.startswith('/admin/packages') %}aria-current="page"{% endif %}>软件包</a>
          <a href="/admin/sources" {% if path.startswith('/admin/sources') %}aria-current="page"{% endif %}>软件来源</a>
          <a href="/admin/setup" {% if path.startswith('/admin/setup') %}aria-current="page"{% endif %}>客户端接入</a>
          <a href="/admin/settings" {% if path.startswith('/admin/settings') %}aria-current="page"{% endif %}>设置</a>
        </nav>
        <details class="account">
          <summary>{{ user.username }}</summary>
          <div class="account-menu">
            <a href="/admin/password" class="btn btn-secondary">修改密码</a>
            <form action="/admin/logout" method="post">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button type="submit" class="btn-secondary btn">退出登录</button>
            </form>
          </div>
        </details>
      {% endif %}
    </div>
  </header>
  <main id="main">
    {% block body %}{% endblock %}
  </main>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-message"></p>
    <div class="toolbar dialog-actions">
      <button id="confirm-cancel" type="button" class="btn-secondary" autofocus>取消</button>
      <button id="confirm-accept" type="button" class="danger">确认</button>
    </div>
  </dialog>
</body>
</html>
