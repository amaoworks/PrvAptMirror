<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrvAptMirror{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/admin/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: light; --bg:#f4f1ea; --card:#fff; --ink:#1b1b1b; --muted:#5c584f; --line:#d9d3c7; --acc:#0b6e4f; --danger:#9b2226; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#1b1b1b; color:#f4f1ea; padding:0.8rem 1.4rem; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; }
    header a { color:#f4f1ea; text-decoration:none; }
    header .brand { justify-self:start; }
    header nav { justify-self:center; display:flex; gap:1.4rem; }
    header .account { justify-self:end; display:flex; align-items:center; gap:0.8rem; }
    header .account a { color:#f4f1ea; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.2rem 1.4rem; margin-bottom:1rem; }
    h1,h2 { margin-top:0; font-weight:600; }
    .muted { color:var(--muted); }
    .err { color:var(--danger); }
    .ok { color:var(--acc); }
    input, button, select { font: inherit; }
    input[type="text"], input[type="password"], input[type="search"], select {
      height: 2.4rem;
      padding: 0 0.75rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }
    input[type="file"] {
      height: 2.4rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      max-width: 100%;
    }
    button, .btn {
      background:var(--acc);
      color:#fff;
      border:0;
      border-radius:6px;
      cursor:pointer;
      height: 2.4rem;
      padding: 0 1rem;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space: nowrap;
    }
    button.danger { background:var(--danger); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .toolbar .grow { flex: 1 1 14rem; min-width: 0; }
    .toolbar select { min-width: 8.5rem; }
    .form-block + .form-block, .toolbar + table, .toolbar + .flash { margin-top: 1rem; }
    .flash { margin: 0.75rem 0 0; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:0.55rem 0.5rem; border-bottom:1px solid var(--line); font-size:0.95rem; vertical-align:middle; }
    code, pre {
      font-family: "IBM Plex Mono", "Noto Sans Mono", ui-monospace, monospace;
      font-size: 0.92rem;
      font-variant-ligatures: none;
      letter-spacing: 0;
    }
    pre {
      background:#1b1b1b;
      color:#f4f1ea;
      padding:1rem 1.1rem;
      border-radius:8px;
      overflow:auto;
      line-height: 1.6;
      tab-size: 2;
    }
    code {
      line-height: 1.45;
    }
    .row { display:flex; gap:1rem; flex-wrap:wrap; }
    .stat { flex:1; min-width:140px; }
    label { display:block; margin:0.5rem 0 0.2rem; }
    .panel { border:1px solid var(--line); border-radius:8px; padding:0.9rem 1rem; margin-bottom:0.85rem; background:#faf8f4; }
    .panel:last-child { margin-bottom:0; }
    .panel-title { color:var(--muted); font-size:0.82rem; margin:0 0 0.55rem; }
    .kv { display:flex; gap:1rem; align-items:baseline; padding:0.35rem 0; border-top:1px solid var(--line); }
    .kv:first-of-type { border-top:0; padding-top:0; }
    .kv .k { color:var(--muted); min-width:7em; flex-shrink:0; }
    .kv .v { word-break:break-all; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>PrvAptMirror</strong></div>
    <nav>
      {% if user %}
        <a href="/admin/">仪表盘</a>
        <a href="/admin/packages">软件包</a>
        <a href="/admin/setup">客户端接入</a>
      {% endif %}
    </nav>
    <div class="account">
      {% if user %}
        <span class="muted">{{ user.username }}</span>
        <a href="/admin/password">改密</a>
        <form action="/admin/logout" method="post" style="display:inline;margin:0;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">退出</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
