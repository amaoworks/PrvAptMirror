{% extends "base.html" %}
{% block title %}修改密码 · PrvAptMirror{% endblock %}
{% block body %}
<section class="card auth-card" aria-labelledby="password-heading">
  <h1 id="password-heading">修改密码</h1>
  {% if forced %}<p class="err flash auth-flash" role="alert">首次登录必须修改引导密码。</p>{% endif %}
  {% if error %}<p class="err flash auth-flash" role="alert">{{ error }}</p>{% endif %}
  <form class="login-form" method="post" action="/admin/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="new_password">新密码（至少 8 个字符）</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8" placeholder="至少 8 位新密码">
    <label for="new_password2">再输入一次</label>
    <input id="new_password2" name="new_password2" type="password" autocomplete="new-password" required minlength="8" placeholder="重复输入新密码">
    <div class="auth-submit">
      <button type="submit">保存新密码</button>
    </div>
  </form>
</section>
{% endblock %}
