{% extends "base.html" %}
{% block title %}修改密码 · PrvAptMirror{% endblock %}
{% block body %}
<div class="card" style="max-width:480px;">
  <h1>修改密码</h1>
  {% if forced %}<p class="err">首次登录必须修改引导密码。</p>{% endif %}
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>新密码（至少 10 个字符）</label>
    <input name="new_password" type="password" autocomplete="new-password" required minlength="10">
    <label>再输入一次</label>
    <input name="new_password2" type="password" autocomplete="new-password" required minlength="10">
    <p><button type="submit">保存</button></p>
  </form>
</div>
{% endblock %}
