{% extends "base.html" %}
{% block title %}登录 · PrvAptMirror{% endblock %}
{% block body %}
<section class="card auth-card" aria-labelledby="login-heading">
  <h1 id="login-heading">管理员登录</h1>
  <p class="auth-subtitle muted">个人apt仓库后台</p>
  {% if error %}<p class="err flash auth-flash" role="alert">{{ error }}</p>{% endif %}
  <form class="login-form" method="post" action="/admin/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" autocomplete="username" placeholder="输入管理员用户名" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
    <div class="auth-submit">
      <button type="submit">登录系统</button>
    </div>
  </form>
</section>
{% endblock %}
