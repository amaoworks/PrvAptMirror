# App only. TLS / reverse proxy belongs on the host.
services:
  app:
    build: .
    user: "1000:1000"
    ports:
      - "${PRVAPT_BIND_HOST:-127.0.0.1}:${PRVAPT_PORT:-8000}:8000"
    environment:
      PRVAPT_DATA_DIR: /var/lib/prvaptmirror
      PRVAPT_TRUSTED_PROXY_CIDRS: "172.16.0.0/12,10.0.0.0/8,127.0.0.1/32"
      PRVAPT_PUBLIC_URL: ${PRVAPT_PUBLIC_URL:-http://127.0.0.1:8000}
      PRVAPT_ADMIN_ORIGINS: ${PRVAPT_ADMIN_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      PRVAPT_ADMIN_USER: ${PRVAPT_ADMIN_USER:-admin}
      PRVAPT_ADMIN_PASSWORD: ${PRVAPT_ADMIN_PASSWORD:-}
      PRVAPT_SECRET_KEY: ${PRVAPT_SECRET_KEY:-}
      PRVAPT_COOKIE_SECURE: ${PRVAPT_COOKIE_SECURE:-auto}
      PRVAPT_ORIGIN_CHECK: ${PRVAPT_ORIGIN_CHECK:-0}
    volumes:
      - ${PRVAPT_HOST_DATA:-./data}:/var/lib/prvaptmirror
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
