map $http_x_forwarded_proto $prvaptmirror_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self'; style-src 'self'; script-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        root /usr/share/nginx/html;
        ssi on;
        try_files /index.html =404;
    }

    location = /assets/repository.css {
        root /usr/share/nginx/html;
        expires 1h;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin-web:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $prvaptmirror_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_redirect off;
    }

    location / {
        root /srv/repository;
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
