server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/repository;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
